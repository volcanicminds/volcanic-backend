name: CI
on:
  push:
    branches: [main, develop, v3]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run depcruise
      # T-3.1: `SET search_path` outside a transaction is what D-01 was. The grep is the
      # cheap half of the rule; the driver guard is the other half and runs with the tests.
      - run: npm run check:session-state
      # T-5.2: the two migration sets stay two. A tenant container that quietly gained a copy
      # of the registry is the shape D-01 needed to become a privilege escalation.
      - run: npm run check:migration-sets
      - run: npm run build
      - run: npx publint
      - run: npx --yes @arethetypeswrong/cli@latest --pack . --profile esm-only

  test:
    runs-on: ubuntu-latest
    needs: verify
    env:
      NODE_ENV: memory
      MFA_DB_SECRET: unit-test-secret-please-change-32xyz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci # compila bcrypt (nativo); ubuntu-latest ha i build tools
      - run: npm test # `pretest` builds first — i test girano contro dist/ (self-reference @volcanicminds/backend)
      # A floor nobody runs is not a gate: `npm run coverage` existed since phase 8 and no job
      # executed it, so it had been failing on its own thresholds unnoticed (T-10.27).
      - run: npm run coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
      # Il job Postgres reale (isolamento fra tenant, bloccante anche al tag) entra con la
      # suite che esegue: T-0.2 di EVO_FRAMEWORK.md, vedi docs/TESTING_V5.md §5.

  # Isolamento fra tenant su Postgres reale (T-0.2). PGlite non ha un pool, quindi non
  # può vedere questa classe di difetti: senza questo job non esiste alcuna prova che
  # i dati di un cliente non siano leggibili da un altro.
  #
  # ATTESO ROSSO fino alla chiusura della fase 3: il data layer Drizzle non esiste ancora
  # e il banco fallisce sull'import. È il suo mestiere. Non va reso `continue-on-error`:
  # un cancello che passa sempre non è un cancello, e la pubblicazione ne dipende.
  test-pg:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: volcanic
          POSTGRES_PASSWORD: volcanic
          POSTGRES_DB: volcanic
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U volcanic" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://volcanic:volcanic@127.0.0.1:5432/volcanic
      DB_POOL_MAX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      # A `pg_dump` older than the server refuses to dump it, and the export tests then skip
      # rather than fail. Installing the matching client is what keeps T-6.2's happy path
      # actually exercised instead of quietly stepped over.
      - run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sed -i 's|deb |deb [signed-by=/usr/share/keyrings/pgdg.gpg] |' /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          pg_dump --version
      - run: npm ci
      # The migration engine has to be judged against a real schema: PGlite has no pool and
      # the point of these tests is that one unqualified file lands in a different container
      # each time (T-5.1).
      - run: npm run test:migrations
      - run: npm run test:e2e:mt:pg

  release:
    runs-on: ubuntu-latest
    needs: [verify, test, test-pg]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, registry-url: 'https://registry.npmjs.org' }
      - run: npm ci
      - run: npm run build
      # Una versione con suffisso (5.0.0-alpha.0) esce su dist-tag `next`, mai su `latest`:
      # `latest` passa alla 5 solo quando la fase 7 è chiusa e la guida di migrazione esiste.
      # Block scalar, not a plain one: the ternary inside puts `? ` and ` : ` in the value, which
      # YAML reads as a complex mapping key and rejects.
      - run: |
          echo "DIST_TAG=$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")" >> $GITHUB_ENV
      - run: npm publish --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
