name: CI
on:
  push:
    branches: [main, develop, v3]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run depcruise
      - run: npm run build
      - run: npx publint
      - run: npx --yes @arethetypeswrong/cli@latest --pack . --profile esm-only

  test:
    runs-on: ubuntu-latest
    needs: verify
    env:
      NODE_ENV: memory
      MFA_DB_SECRET: unit-test-secret-please-change-32xyz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci # compila bcrypt (nativo); ubuntu-latest ha i build tools
      - run: npm test # `pretest` builds first — i test girano contro dist/ (self-reference @volcanicminds/backend)
      # Il job Postgres reale (isolamento fra tenant, bloccante anche al tag) entra con la
      # suite che esegue: T-0.2 di EVO_FRAMEWORK.md, vedi docs/TESTING_V5.md §5.

  release:
    runs-on: ubuntu-latest
    needs: [verify, test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, registry-url: 'https://registry.npmjs.org' }
      - run: npm ci
      - run: npm run build
      # Una versione con suffisso (5.0.0-alpha.0) esce su dist-tag `next`, mai su `latest`:
      # `latest` passa alla 5 solo quando la fase 7 è chiusa e la guida di migrazione esiste.
      - run: echo "DIST_TAG=$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")" >> $GITHUB_ENV
      - run: npm publish --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
